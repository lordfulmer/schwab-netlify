<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Options Chain</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --line: #1c2433;
    --text: #e6e9ef;
    --dim: #6b7688;
    --call: #34d399;
    --call-dim: rgba(52, 211, 153, 0.08);
    --call-itm: rgba(52, 211, 153, 0.14);
    --put: #f87171;
    --put-dim: rgba(248, 113, 113, 0.08);
    --put-itm: rgba(248, 113, 113, 0.14);
    --atm: #f5c451;
    --mono: 'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    margin: 0;
    padding: 24px 16px 60px;
  }
  .header {
    max-width: 1100px;
    margin: 0 auto 16px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  .symbol-input {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 8px 14px;
    border-radius: 8px;
    width: 130px;
    text-transform: uppercase;
  }
  .symbol-input:focus { outline: 1px solid var(--dim); }
  .go-btn {
    background: var(--line);
    color: var(--text);
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
  }
  .go-btn:hover { background: #263047; }
  .price-block {
    font-family: var(--mono);
    margin-left: auto;
    text-align: right;
  }
  .price-block .px {
    font-size: 26px;
    font-weight: 700;
  }
  .price-block .lbl {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .controls-row {
    max-width: 1100px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .select {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .col-dropdown { position: relative; }
  .col-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .col-btn:hover { background: #182034; }
  .col-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    z-index: 20;
    min-width: 150px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .col-menu.open { display: block; }
  .col-menu label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 5px 0;
    cursor: pointer;
    user-select: none;
  }
  .col-menu input { accent-color: var(--atm); cursor: pointer; }
  .exp-tabs {
    max-width: 1100px;
    margin: 0 auto 14px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .exp-tab {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .exp-tab.active {
    color: var(--atm);
    border-color: var(--atm);
  }
  .chain-wrap {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .table-scroll {
    overflow-x: auto;
    max-height: 70vh;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  thead th {
    font-family: var(--sans);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--dim);
    font-weight: 600;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
  }
  thead .side-call { color: var(--call); text-align: right; }
  thead .side-put { color: var(--put); text-align: left; }
  thead .strike-hdr { text-align: center; }
  tbody td {
    padding: 6px 8px;
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .strike-cell {
    text-align: center;
    font-weight: 700;
    color: var(--text);
    background: rgba(255,255,255,0.02);
  }
  tr.atm .strike-cell {
    color: var(--atm);
    background: rgba(245, 196, 81, 0.1);
  }
  .call-cell { background: transparent; }
  .put-cell { background: transparent; }
  tr.call-itm .call-cell { background: var(--call-itm); }
  tr.put-itm .put-cell { background: var(--put-itm); }
  .bid { color: var(--dim); }
  .last { color: var(--text); font-weight: 600; }
  .greek { color: var(--dim); font-size: 11px; }
  .empty, .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 13px;
  }
  .err {
    max-width: 1100px;
    margin: 20px auto;
    background: var(--put-dim);
    border: 1px solid var(--put);
    color: var(--put);
    padding: 14px 16px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 13px;
  }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
</style>
</head>
<body>

  <div class="header">
    <input class="symbol-input" id="symbolInput" value="NVDA" maxlength="6">
    <button class="go-btn" onclick="loadChain()">Load Chain</button>
    <div class="price-block">
      <div class="px" id="underlyingPx">—</div>
      <div class="lbl" id="underlyingLbl">underlying</div>
    </div>
  </div>

  <div class="controls-row">
    <select class="select" id="expSelect" onchange="onExpSelectChange(this.value)"></select>

    <div class="col-dropdown">
      <button class="col-btn" id="colBtn" onclick="toggleColMenu()">Columns ▾</button>
      <div class="col-menu" id="colMenu">
        <label><input type="checkbox" data-col="iv" checked onchange="onColToggle(this)"> IV%</label>
        <label><input type="checkbox" data-col="delta" checked onchange="onColToggle(this)"> Delta</label>
        <label><input type="checkbox" data-col="theta" onchange="onColToggle(this)"> Theta</label>
        <label><input type="checkbox" data-col="vega" onchange="onColToggle(this)"> Vega</label>
      </div>
    </div>
  </div>

  <div class="exp-tabs" id="expTabs"></div>

  <div class="chain-wrap">
    <div class="table-scroll">
      <table id="chainTable" style="display:none;">
        <thead id="chainHead"></thead>
        <tbody id="chainBody"></tbody>
      </table>
    </div>
    <div class="loading" id="statusMsg">Enter a symbol and hit Load Chain.</div>
  </div>

  <script>
    let fullData = null;
    let expDates = [];
    let currentExp = null;
    const columns = { iv: true, delta: true, theta: false, vega: false };
    const COL_LABEL = { iv: 'IV', delta: 'Δ', theta: 'Θ', vega: 'V' };

    function toggleColMenu() {
      document.getElementById('colMenu').classList.toggle('open');
    }
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('colMenu');
      const btn = document.getElementById('colBtn');
      if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove('open');
      }
    });
    function onColToggle(input) {
      columns[input.dataset.col] = input.checked;
      if (currentExp) renderChain(currentExp);
    }

    async function loadChain() {
      const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
      if (!symbol) return;

      const statusMsg = document.getElementById('statusMsg');
      const table = document.getElementById('chainTable');
      table.style.display = 'none';
      statusMsg.style.display = 'block';
      statusMsg.textContent = `Loading ${symbol}...`;
      document.getElementById('expTabs').innerHTML = '';
      document.getElementById('expSelect').innerHTML = '';

      try {
        const res = await fetch(`/.netlify/functions/schwab-options-chain?symbol=${encodeURIComponent(symbol)}`);
        const text = await res.text();
        if (!res.ok) {
          statusMsg.textContent = `Error ${res.status}: ${text.slice(0, 200)}`;
          return;
        }
        const data = JSON.parse(text);
        fullData = data;

        document.getElementById('underlyingPx').textContent =
          data.underlyingPrice ? '$' + data.underlyingPrice.toFixed(2) : '—';
        document.getElementById('underlyingLbl').textContent = symbol;

        expDates = Object.keys(data.callExpDateMap || {});
        if (!expDates.length) {
          statusMsg.textContent = 'No expirations returned for this symbol.';
          return;
        }
        renderExpControls(expDates);
        renderChain(expDates[0]);
      } catch (err) {
        statusMsg.textContent = 'Request failed: ' + err.message;
      }
    }

    function expLabel(exp) {
      const [date, dte] = exp.split(':');
      return dte !== undefined ? `${date} (${dte}d)` : date;
    }

    function renderExpControls(dates) {
      const tabsEl = document.getElementById('expTabs');
      const selectEl = document.getElementById('expSelect');
      tabsEl.innerHTML = '';
      selectEl.innerHTML = '';

      dates.forEach((exp, i) => {
        const btn = document.createElement('button');
        btn.className = 'exp-tab' + (i === 0 ? ' active' : '');
        btn.textContent = expLabel(exp);
        btn.onclick = () => selectExp(exp);
        btn.dataset.exp = exp;
        tabsEl.appendChild(btn);

        const opt = document.createElement('option');
        opt.value = exp;
        opt.textContent = expLabel(exp);
        selectEl.appendChild(opt);
      });
    }

    function onExpSelectChange(exp) {
      selectExp(exp);
    }

    function selectExp(exp) {
      document.querySelectorAll('.exp-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.exp === exp);
      });
      document.getElementById('expSelect').value = exp;
      renderChain(exp);
    }

    function fmt(n, d = 2) {
      return (n === undefined || n === null) ? '—' : Number(n).toFixed(d);
    }

    function activeCols() {
      return Object.keys(columns).filter(c => columns[c]);
    }

    function renderHead() {
      const head = document.getElementById('chainHead');
      const cols = activeCols();
      const callCols = cols.map(c => `<th class="side-call">${COL_LABEL[c]}</th>`).join('');
      const putCols = cols.slice().reverse().map(c => `<th class="side-put">${COL_LABEL[c]}</th>`).join('');
      head.innerHTML = `
        <tr>
          <th class="side-call" colspan="${cols.length + 2}">Calls</th>
          <th class="strike-hdr">Strike</th>
          <th class="side-put" colspan="${cols.length + 2}">Puts</th>
        </tr>
        <tr>
          ${callCols}
          <th class="side-call">Bid</th>
          <th class="side-call">Last</th>
          <th class="strike-hdr"></th>
          <th class="side-put">Last</th>
          <th class="side-put">Bid</th>
          ${putCols}
        </tr>
      `;
    }

    function greekCell(contract, col) {
      if (col === 'iv') return contract ? fmt(contract.volatility, 0) + '%' : '—';
      return contract ? fmt(contract[col]) : '—';
    }

    function renderChain(expKey) {
      currentExp = expKey;
      const statusMsg = document.getElementById('statusMsg');
      const table = document.getElementById('chainTable');
      const body = document.getElementById('chainBody');
      body.innerHTML = '';

      const calls = fullData.callExpDateMap[expKey] || {};
      const puts = (fullData.putExpDateMap && fullData.putExpDateMap[expKey]) || {};
      const strikes = Object.keys(calls).map(Number).sort((a, b) => a - b);
      const underlying = fullData.underlyingPrice || 0;

      if (!strikes.length) {
        statusMsg.textContent = 'No strikes found for this expiration.';
        table.style.display = 'none';
        return;
      }

      renderHead();
      const cols = activeCols();

      strikes.forEach(strike => {
        const strikeKey = strike.toFixed(1);
        const c = (calls[strikeKey] || calls[String(strike)] || [])[0];
        const p = (puts[strikeKey] || puts[String(strike)] || [])[0];

        const tr = document.createElement('tr');
        const isAtm = Math.abs(strike - underlying) < (underlying * 0.0025);
        const callItm = strike < underlying;
        const putItm = strike > underlying;

        if (isAtm) tr.classList.add('atm');
        if (callItm) tr.classList.add('call-itm');
        if (putItm) tr.classList.add('put-itm');

        const callGreekCells = cols.map(col =>
          `<td class="call-cell greek">${greekCell(c, col)}</td>`
        ).join('');
        const putGreekCells = cols.slice().reverse().map(col =>
          `<td class="put-cell greek" style="text-align:left;">${greekCell(p, col)}</td>`
        ).join('');

        tr.innerHTML = `
          ${callGreekCells}
          <td class="call-cell bid">${c ? fmt(c.bid) : '—'}</td>
          <td class="call-cell last">${c ? fmt(c.last) : '—'}</td>
          <td class="strike-cell">${strike.toFixed(strike % 1 === 0 ? 0 : 2)}</td>
          <td class="put-cell last" style="text-align:left;">${p ? fmt(p.last) : '—'}</td>
          <td class="put-cell bid" style="text-align:left;">${p ? fmt(p.bid) : '—'}</td>
          ${putGreekCells}
        `;
        body.appendChild(tr);
      });

      statusMsg.style.display = 'none';
      table.style.display = 'table';

      requestAnimationFrame(() => {
        const atmRow = body.querySelector('tr.atm');
        if (atmRow) atmRow.scrollIntoView({ block: 'center' });
      });
    }

    loadChain();
  </script>
</body>
</html>
