[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Give the MCP server a clean URL to hand to Claude's connector settings.
# The /mcp/<secret> form is the one to use: the path survives every request a
# client makes, where a query string may not.
[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
